name: Build APK

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: signing
          key: piweb-signing-keystore-v1

      - name: Generate stable keystore if missing
        run: |
          if [ ! -f signing/piweb.jks ]; then
            mkdir -p signing
            keytool -genkeypair -v -keystore signing/piweb.jks -alias piweb \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass piweb2026 -keypass piweb2026 \
              -dname "CN=PiWeb, OU=Personal, O=gztxt, C=CN"
          fi

      - name: Build Debug APK (stable signing)
        env:
          PIWEB_KEYSTORE: ${{ github.workspace }}/signing/piweb.jks
          PIWEB_STORE_PASSWORD: piweb2026
          PIWEB_KEY_ALIAS: piweb
          PIWEB_KEY_PASSWORD: piweb2026
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK
        run: find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-apk-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
